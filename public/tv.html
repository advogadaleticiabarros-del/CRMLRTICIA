<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Painel da TV — Escritório</title>
  <link rel="icon" href="/logo-sem-fundo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Tela pensada para TV: tudo em rem, com a base presa à largura da tela
       (20px numa TV Full HD). Só flexbox, sem grid nem gap, para funcionar no
       navegador de TVs mais antigas. Visual do CRM: espresso + dourado. */
    :root {
      --ink: #15110c; --ink-2: #211a12; --ink-3: #2d2418; --line: rgba(224,192,116,.16);
      --gold: #c19a4e; --gold-bright: #ecc869; --text: #f4efe4; --soft: #c9bfa9; --muted: #9a8f78;
      --green: #4cc38a; --amber: #e8b04a; --red: #ef6b5e; --gray: #6f6758; --blue: #7aa7e8;
    }
    * { box-sizing: border-box; }
    html { font-size: 20px; font-size: calc(100vw / 96); }
    html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); overflow: hidden; }
    body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; cursor: none; }
    .serif { font-family: 'Spectral', Georgia, serif; }
    #app { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; padding: 1.4rem 2.2rem 1rem; }

    /* ── Barra de cima ── */
    .topo { display: flex; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
    .marca { display: flex; align-items: center; margin-right: 2rem; }
    .marca img { height: 2.6rem; margin-right: .8rem; }
    .marca b { font-family: 'Spectral', Georgia, serif; font-weight: 600; font-size: 1.35rem; color: var(--gold-bright); display: block; line-height: 1.1; }
    .marca span { font-size: .75rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .abas { display: flex; flex: 1; }
    .aba { font: inherit; font-size: .95rem; font-weight: 600; color: var(--soft); background: transparent; border: 2px solid transparent; border-radius: .6rem; padding: .5rem .8rem; margin-right: .3rem; white-space: nowrap; }
    .aba .num { display: inline-block; min-width: 1.3rem; height: 1.3rem; line-height: 1.3rem; border-radius: .35rem; background: var(--ink-3); color: var(--gold-bright); font-size: .75rem; text-align: center; margin-right: .45rem; }
    .aba.ativa { color: var(--ink); background: var(--gold-bright); }
    .aba.ativa .num { background: rgba(0,0,0,.15); color: var(--ink); }
    .relogio { text-align: right; margin-left: 1rem; }
    .relogio b { display: block; font-size: 2rem; font-weight: 600; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
    .relogio span { font-size: .8rem; color: var(--muted); }

    /* ── Conteúdo ── */
    .palco { flex: 1; position: relative; overflow: hidden; margin-top: 1rem; }
    .vista { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; display: none; padding: .35rem; }
    .vista.ativa { display: block; animation: entra .35s ease-out; }
    @keyframes entra { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }
    .rolagem { height: 100%; overflow: hidden; }
    h2 { font-family: 'Spectral', Georgia, serif; font-weight: 600; font-size: 1.5rem; margin: 0 0 .8rem; color: var(--gold-bright); }
    h3 { font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; }

    /* Foco do controle remoto: precisa ser visto do sofá. */
    .focavel { outline: none; transition: transform .15s ease, box-shadow .15s ease; }
    .focavel.foco { box-shadow: 0 0 0 .22rem var(--gold-bright), 0 .6rem 1.6rem rgba(0,0,0,.5); transform: scale(1.03); position: relative; z-index: 2; }
    .aba.focavel.foco, .coluna.focavel.foco, .conversa.focavel.foco, .item.focavel.foco { transform: none; }
    .rolagem { padding: .3rem; margin: -.3rem; }

    /* ── Faixa de números ── */
    .numeros { display: flex; margin-bottom: 1rem; }
    .numero { flex: 1; background: var(--ink-2); border: 1px solid var(--line); border-radius: .8rem; padding: .8rem 1rem; margin-right: .8rem; }
    .numero:last-child { margin-right: 0; }
    .numero b { display: block; font-size: 2.3rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .numero span { font-size: .85rem; color: var(--soft); }
    .numero.bom b { color: var(--green); } .numero.atencao b { color: var(--amber); } .numero.ruim b { color: var(--red); }

    /* ── Painel geral ── */
    .colunas { display: flex; height: 100%; }
    .coluna { flex: 1; background: var(--ink-2); border: 1px solid var(--line); border-radius: 1rem; padding: 1.2rem 1.3rem; margin-right: 1rem; overflow: hidden; display: flex; flex-direction: column; }
    .coluna:last-child { margin-right: 0; }
    .coluna .rodape-col { margin-top: auto; padding-top: .6rem; font-size: .8rem; color: var(--muted); }
    .grande { font-size: 3.4rem; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin: .2rem 0 .3rem; font-variant-numeric: tabular-nums; }
    .linha { display: flex; align-items: baseline; padding: .5rem 0; border-bottom: 1px solid var(--line); font-size: 1rem; }
    .linha:last-child { border-bottom: 0; }
    .linha .q { margin-left: auto; padding-left: .8rem; color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .linha .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .linha .t small { display: block; color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Escritório virtual ── */
    .chefe { display: flex; align-items: center; background: linear-gradient(90deg, rgba(193,154,78,.18), rgba(193,154,78,.04)); border: 1px solid var(--line); border-radius: .9rem; padding: .8rem 1.2rem; margin-bottom: 1rem; }
    .chefe .avatar { width: 3rem; height: 3rem; border-radius: 50%; background: var(--gold); color: var(--ink); font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; margin-right: 1rem; }
    .chefe b { font-size: 1.05rem; } .chefe p { margin: .15rem 0 0; color: var(--soft); font-size: .95rem; }
    .chefe .contagem { margin-left: auto; display: flex; }
    .chefe .contagem div { text-align: center; margin-left: 1.6rem; }
    .chefe .contagem b { display: block; font-size: 1.8rem; }
    .chefe .contagem span { font-size: .75rem; color: var(--muted); }
    .sala { display: flex; flex-wrap: wrap; margin-right: -.8rem; }
    .agente { width: calc(12.5% - .8rem); margin: 0 .8rem .8rem 0; background: var(--ink-2); border: 1px solid var(--line); border-left: .3rem solid var(--setor, var(--gold)); border-radius: .8rem; padding: .7rem .8rem; min-height: 7rem; display: flex; flex-direction: column; }
    .agente .cab { display: flex; align-items: center; }
    .agente .ini { width: 2.2rem; height: 2.2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; color: #fff; margin-right: .6rem; flex: none; position: relative; }
    .agente .ini i { position: absolute; right: -.1rem; bottom: -.1rem; width: .75rem; height: .75rem; border-radius: 50%; border: .15rem solid var(--ink-2); background: var(--gray); }
    .agente.trabalhando .ini i { background: var(--green); animation: pulso 1.6s ease-in-out infinite; }
    .agente.parado .ini i { background: var(--amber); }
    .agente.erro .ini i { background: var(--red); }
    .agente.desligado { opacity: .55; }
    @keyframes pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(76,195,138,.7); } 50% { box-shadow: 0 0 0 .4rem rgba(76,195,138,0); } }
    .agente .nome { font-weight: 600; font-size: .95rem; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agente .cargo { font-size: .72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agente .faz { font-size: .8rem; color: var(--soft); margin-top: .45rem; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .agente .quando { margin-top: auto; padding-top: .35rem; font-size: .72rem; color: var(--muted); display: flex; }
    .agente .quando em { font-style: normal; margin-left: auto; color: var(--gold); }
    .agente.trabalhando .quando span { color: var(--green); font-weight: 600; }
    .agente.erro .quando span { color: var(--red); font-weight: 600; }
    .legenda { display: flex; font-size: .8rem; color: var(--muted); margin-bottom: .8rem; }
    .legenda span { margin-right: 1.4rem; display: flex; align-items: center; }
    .legenda i { width: .7rem; height: .7rem; border-radius: 50%; margin-right: .4rem; display: inline-block; }

    /* ── WhatsApp ── */
    .lista { list-style: none; margin: 0; padding: 0; }
    .conversa { display: flex; align-items: center; padding: .65rem .8rem; border-radius: .6rem; margin-bottom: .35rem; background: var(--ink-3); }
    .conversa .bola { width: 2.2rem; height: 2.2rem; border-radius: 50%; background: #2f5d46; color: #d8f5e6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; margin-right: .8rem; flex: none; }
    .conversa .meio { flex: 1; min-width: 0; }
    .conversa .meio b { display: block; font-size: 1rem; }
    .conversa .meio small { display: block; color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conversa .espera { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: .6rem; }
    .espera.ok { color: var(--soft); } .espera.atencao { color: var(--amber); } .espera.ruim { color: var(--red); }
    .naolidas { background: var(--green); color: #082015; font-weight: 700; font-size: .75rem; border-radius: 1rem; padding: .1rem .5rem; margin-left: .6rem; }
    .seta { width: 1.6rem; text-align: center; margin-right: .5rem; font-weight: 700; }
    .seta.in { color: var(--green); } .seta.out { color: var(--blue); }
    .botao { font: inherit; font-size: .95rem; font-weight: 600; color: var(--text); background: var(--ink-3); border: 1px solid var(--line); border-radius: .6rem; padding: .55rem 1rem; }
    .alerta { background: rgba(239,107,94,.15); border: 1px solid rgba(239,107,94,.5); color: #ffd3cd; border-radius: .7rem; padding: .7rem 1rem; margin-bottom: 1rem; font-weight: 600; }
    .vazio { color: var(--muted); padding: 1rem 0; font-size: 1rem; }

    /* ── Hoje ── */
    .item { display: flex; align-items: flex-start; padding: .75rem .9rem; border-radius: .7rem; background: var(--ink-3); margin-bottom: .5rem; border-left: .3rem solid var(--gray); }
    .item.critico { border-left-color: var(--red); } .item.atencao { border-left-color: var(--amber); } .item.rotina { border-left-color: var(--blue); }
    .item .ic { font-size: 1.3rem; margin-right: .8rem; line-height: 1.2; }
    .item b { display: block; font-size: 1.02rem; } .item small { color: var(--soft); font-size: .85rem; }
    .saude { display: flex; flex-wrap: wrap; }
    .saude div { width: calc(50% - .5rem); margin: 0 .5rem .5rem 0; background: var(--ink-3); border-radius: .6rem; padding: .6rem .8rem; font-size: .92rem; display: flex; align-items: center; }
    .saude i { width: .8rem; height: .8rem; border-radius: 50%; margin-right: .6rem; flex: none; }

    /* ── Rodapé com as teclas ── */
    .rodape { display: flex; align-items: center; padding-top: .7rem; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); margin-top: .8rem; }
    .rodape span { margin-right: 1.6rem; }
    .rodape kbd { font-family: inherit; background: var(--ink-3); color: var(--soft); border: 1px solid var(--line); border-radius: .3rem; padding: .05rem .4rem; margin-right: .3rem; }
    .rodape .estado { margin-left: auto; margin-right: 0; color: var(--soft); }
    .barra-rot { height: .2rem; background: var(--ink-3); border-radius: .2rem; overflow: hidden; width: 8rem; display: inline-block; vertical-align: middle; margin-left: .6rem; }
    .barra-rot i { display: block; height: 100%; background: var(--gold); width: 0; }

    /* ── Menu e janela de detalhe ── */
    .camada { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(10,8,5,.78); display: none; align-items: center; justify-content: center; z-index: 10; }
    .camada.aberta { display: flex; }
    .janela { background: var(--ink-2); border: 1px solid var(--line); border-radius: 1.2rem; padding: 1.6rem 1.8rem; width: 46rem; max-height: 86%; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 2rem 4rem rgba(0,0,0,.6); }
    .janela.menu { width: 30rem; }
    .opcao { display: flex; align-items: center; width: 100%; text-align: left; font: inherit; font-size: 1.1rem; color: var(--text); background: var(--ink-3); border: 0; border-radius: .7rem; padding: .8rem 1rem; margin-bottom: .5rem; }
    .opcao .num { width: 1.8rem; height: 1.8rem; line-height: 1.8rem; text-align: center; border-radius: .4rem; background: var(--ink); color: var(--gold-bright); font-weight: 700; margin-right: .9rem; font-size: .9rem; }
    .opcao em { margin-left: auto; font-style: normal; color: var(--muted); font-size: .9rem; }
    .historico { overflow: hidden; margin-top: .6rem; }
    .historico .linha .t { white-space: normal; }
    .historico .erro { color: var(--red); }
    .sub { color: var(--soft); font-size: .95rem; margin: 0 0 .8rem; line-height: 1.45; }

    /* ── Entrada (sem login) ── */
    .entrada { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; align-items: center; justify-content: center; text-align: center; z-index: 20; background: var(--ink); }
    .entrada.aberta { display: flex; }
    .entrada .caixa { max-width: 40rem; }
    .entrada .pareamento { max-width: 70rem; display: flex; align-items: center; text-align: left; }
    .pareamento .qr { background: #fff; border-radius: 1.2rem; padding: 1rem; margin-right: 3rem; flex: none; }
    .pareamento .qr img { display: block; width: 17rem; height: 17rem; margin: 0; }
    .pareamento h2 { font-size: 2rem; margin-bottom: .4rem; }
    .pareamento .codigo { font-size: 5.5rem; font-weight: 700; letter-spacing: .5rem; color: var(--gold-bright); line-height: 1.1; font-variant-numeric: tabular-nums; margin: .4rem 0 1rem; }
    .pareamento ol { color: var(--soft); font-size: 1.2rem; line-height: 1.6; padding-left: 1.4rem; margin: 0; }
    .pareamento ol b { color: var(--text); }
    .pareamento .vale { color: var(--muted); font-size: .95rem; margin-top: 1rem; }
    .entrada img { height: 6rem; margin-bottom: 1rem; }
    .entrada p { color: var(--soft); font-size: 1.15rem; line-height: 1.5; }
    .entrada .botao { font-size: 1.2rem; padding: .8rem 1.6rem; margin-top: 1rem; }
    /* ── Sala dos agentes (playground) ── */
    .sala { position: relative; height: 100%; }
    .comodo { position: absolute; background-color: #1f1810; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 1.6rem 1.6rem; border: 1px solid var(--line); border-top: .35rem solid var(--cor); border-radius: .8rem; }
    .comodo .placa { position: absolute; left: .7rem; top: .45rem; font-size: .85rem; font-weight: 600; color: var(--soft); white-space: nowrap; }
    .comodo .placa b { color: var(--cor); margin-left: .3rem; }
    .comodo .cafe-canto { position: absolute; right: .7rem; bottom: .5rem; font-size: 1.3rem; opacity: .75; }
    .comodo.ceo { background-color: #2a2014; }
    .ceo-info { position: absolute; left: 0; right: 0; bottom: .8rem; text-align: center; }
    .ceo-info b { display: block; font-size: 2.2rem; color: var(--gold-bright); line-height: 1; font-variant-numeric: tabular-nums; }
    .ceo-info span { font-size: .8rem; color: var(--soft); }
    .ceo-info.pulso b { animation: pulsoCeo .6s ease-out; }
    @keyframes pulsoCeo { 40% { transform: scale(1.35); color: #fff; } }
    .mesa { position: absolute; width: 4.4rem; height: 2rem; margin: -1rem 0 0 -2.2rem; background: #6b5236; border-radius: .3rem; box-shadow: 0 .3rem 0 #3f3020; z-index: 1; }
    .mesa i { position: absolute; left: 1.3rem; top: -1.25rem; width: 1.8rem; height: 1.25rem; background: #2d2d33; border: .15rem solid #0d0d10; border-radius: .15rem; }
    .mesa.ligada i { background: #7fd3ff; box-shadow: 0 0 .9rem rgba(127,211,255,.8); animation: tela 1.4s steps(2) infinite; }
    .mesa.erro i { background: var(--red); box-shadow: 0 0 .9rem rgba(239,107,94,.8); }
    .mesa.grande { width: 7rem; margin-left: -3.5rem; background: #7a5a2e; }
    @keyframes tela { 50% { background: #b6ecff; } }
    .boneco { position: absolute; width: 2.6rem; height: 3.4rem; margin: -3.6rem 0 0 -1.3rem; transition: left 3.5s linear, top 3.5s linear; z-index: 3; border-radius: .6rem; }
    .boneco .cabeca { position: absolute; left: .55rem; top: 0; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: #f0c58e; box-shadow: inset 0 .45rem 0 var(--cabelo, #3b2a1a); }
    .boneco .corpo { position: absolute; left: .3rem; top: 1.35rem; width: 2rem; height: 1.7rem; border-radius: .7rem .7rem .3rem .3rem; }
    .boneco .nomeb { position: absolute; top: 3.15rem; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .66rem; font-weight: 600; color: var(--text); background: rgba(0,0,0,.6); padding: 0 .35rem; border-radius: .3rem; }
    .boneco .extra { position: absolute; left: 1.9rem; top: -1rem; font-size: .9rem; font-weight: 700; }
    .boneco.st-trabalhando .corpo { animation: digita .32s ease-in-out infinite alternate; }
    .boneco.andando .cabeca, .boneco.andando .corpo { animation: passo .38s ease-in-out infinite alternate; }
    .boneco.st-desligado { opacity: .5; }
    .boneco.st-desligado .extra::after { content: 'z z'; color: var(--soft); display: block; animation: zzz 2.4s ease-in-out infinite; }
    .boneco.st-erro .extra::after { content: '!'; display: block; width: 1.1rem; height: 1.1rem; line-height: 1.1rem; text-align: center; border-radius: 50%; background: var(--red); color: #fff; animation: pula .7s ease-in-out infinite alternate; }
    .boneco.no-cafe .extra::after { content: '☕'; display: block; }
    @keyframes digita { to { transform: translateY(.14rem); } }
    @keyframes passo { to { transform: translateY(-.28rem); } }
    @keyframes zzz { 0% { opacity: 0; transform: translate(0, .3rem); } 50% { opacity: 1; } 100% { opacity: 0; transform: translate(.5rem, -.8rem); } }
    @keyframes pula { to { transform: translateY(-.35rem); } }
    .bolha { position: absolute; max-width: 17rem; background: #f4efe4; color: #15110c; border-radius: .8rem; padding: .45rem .75rem; font-size: .8rem; line-height: 1.3; font-weight: 500; transform: translate(-50%, -100%); margin-top: -4rem; opacity: 0; transition: opacity .4s; z-index: 6; pointer-events: none; box-shadow: 0 .4rem 1rem rgba(0,0,0,.4); }
    .bolha b { display: block; font-size: .72rem; color: #6b5a3c; }
    .bolha.vis { opacity: 1; }
    .bolha.erro { background: #ffd8d2; }
    .envelope { position: absolute; font-size: 1.3rem; margin: -2.5rem 0 0 -.6rem; transition: left 2.2s ease-in-out, top 2.2s ease-in-out; z-index: 7; pointer-events: none; }

    /* ── Avisos com som (canto direito) ── */
    .avisos { position: absolute; top: 6.6rem; right: 2.2rem; width: 34rem; z-index: 8; }
    .aviso { display: flex; align-items: center; background: #2b2216; border: 1px solid var(--line); border-left: .45rem solid var(--gold); border-radius: .9rem; padding: 1rem 1.2rem; margin-bottom: .7rem; box-shadow: 0 1.2rem 3rem rgba(0,0,0,.6); animation: avisoEntra .45s cubic-bezier(.2,.9,.3,1.2); }
    .aviso.sai { animation: avisoSai .4s ease-in forwards; }
    .aviso .ic { font-size: 2.2rem; margin-right: 1rem; }
    .aviso b { display: block; font-size: 1.3rem; line-height: 1.2; }
    .aviso small { display: block; color: var(--soft); font-size: .95rem; margin-top: .2rem; }
    .aviso.urgente, .aviso.erro { border-left-color: var(--red); } .aviso.audiencia, .aviso.aprovacao, .aviso.prazo { border-left-color: var(--amber); }
    .aviso.protocolo { border-left-color: var(--green); background: #1d2a1f; } .aviso.conversa { border-left-color: #25d366; }
    @keyframes avisoEntra { from { opacity: 0; transform: translateX(4rem) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes avisoSai { to { opacity: 0; transform: translateX(3rem); } }
    .comecar { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(10,8,5,.86); display: none; align-items: center; justify-content: center; text-align: center; z-index: 15; }
    .comecar.aberta { display: flex; }
