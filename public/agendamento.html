<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agende sua consulta — Dra. Letícia Barros</title>
<link rel="icon" type="image/png" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #211c18;
    --text: #34291f;
    --muted: #7b6f60;
    --soft: #f8f2e8;
    --paper: #fffdf8;
    --line: #eadfc9;
    --gold: #bf9340;
    --gold-2: #d8b86f;
    --gold-3: #f1dfae;
    --green: #2f8f63;
    --danger: #b94a40;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--soft);
    color: var(--text);
    padding: 28px 16px 72px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .brand-mark {
    width: 46px; height: 46px; border-radius: 14px;
    display: grid; place-items: center;
    background: var(--paper);
    border: 1px solid rgba(191, 147, 64, .28);
    box-shadow: 0 10px 24px rgba(84, 56, 17, .08);
    flex: 0 0 auto;
  }
  .brand-mark img { width: 32px; height: 32px; object-fit: contain; }
  .brand-name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1; }
  .brand-sub { margin-top: 3px; color: var(--gold); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(73, 52, 18, .08);
    padding: clamp(22px, 5vw, 34px);
  }

  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(26px, 5vw, 32px); font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  p.sub { color: var(--muted); margin-bottom: 26px; font-size: 15px; }

  .dia-grupo { margin-bottom: 22px; }
  .dia-titulo { font-weight: 700; font-size: 13px; text-transform: capitalize; margin-bottom: 10px; color: var(--gold); letter-spacing: .3px; }
  .slots { display: flex; flex-wrap: wrap; gap: 10px; }
  .slot-btn {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 16px;
    min-height: 44px;
    min-width: 44px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease, color .18s ease, transform .18s ease;
  }
  .slot-btn:hover { border-color: var(--gold); transform: translateY(-1px); }
  .slot-btn.selecionado { background: linear-gradient(135deg, var(--gold-2), var(--gold)); color: #fff; border-color: var(--gold); }

  form { margin-top: 30px; display: none; flex-direction: column; gap: 14px; padding-top: 26px; border-top: 1px solid var(--line); }
  form.ativo { display: flex; }
  label { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px; display: block; }
  input, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(191, 147, 64, .14); }
  textarea { resize: vertical; min-height: 80px; }
  .website-honeypot { position: absolute; left: -9999px; opacity: 0; }

  button[type=submit] {
    background: linear-gradient(135deg, var(--gold-2), var(--gold));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 6px;
    min-height: 48px;
    box-shadow: 0 12px 26px rgba(191, 147, 64, .24);
    transition: transform .18s ease, opacity .18s ease;
  }
  button[type=submit]:hover:not(:disabled) { transform: translateY(-1px); }
  button[type=submit]:disabled { opacity: 0.6; cursor: default; transform: none; }

  .msg { margin-top: 18px; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; }
  .msg.erro { background: #fbeceb; color: var(--danger); border: 1px solid rgba(185, 74, 64, .22); }
  .msg.sucesso { background: #eaf6ef; color: #1e6b34; border: 1px solid rgba(47, 143, 99, .24); }
  .vazio { color: var(--muted); font-size: 14px; }

  .footer-note { max-width: 560px; margin: 22px auto 0; text-align: center; color: var(--muted); font-size: 11.5px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark"><img src="/logo.png" alt="Dra. Letícia Barros" onerror="this.style.display='none'" /></div>
    <div>
      <div class="brand-name">Dra. Letícia Barros</div>
      <div class="brand-sub">Advocacia estratégica</div>
    </div>
  </div>

  <div class="card">
    <h1>Agende sua consulta</h1>
    <p class="sub">Escolha um horário disponível abaixo — a confirmação é imediata.</p>

    <div id="listaSlots"><p class="vazio">Carregando horários…</p></div>

    <form id="formAgendar">
      <input type="text" name="website" class="website-honeypot" tabindex="-1" autocomplete="off">
      <div>
        <label for="name">Nome completo</label>
        <input type="text" id="name" name="name" required minlength="3">
      </div>
      <div>
        <label for="phone">WhatsApp</label>
        <input type="tel" id="phone" name="phone" required placeholder="(27) 99999-9999">
      </div>
      <div>
        <label for="email">E-mail (opcional)</label>
        <input type="email" id="email" name="email">
      </div>
      <div>
        <label for="message">Motivo da consulta (opcional)</label>
        <textarea id="message" name="message"></textarea>
      </div>
      <button type="submit" id="btnSubmit">Confirmar agendamento</button>
    </form>

    <div id="msgArea"></div>
  </div>

  <p class="footer-note">Documento eletrônico da Advocacia Letícia Barros. O agendamento é uma pré-reserva; a confirmação final ocorre por contato direto do escritório.</p>
</div>

<script>
(function () {
  const API_BASE = window.location.origin;
  const listaSlots = document.getElementById('listaSlots');
  const form = document.getElementById('formAgendar');
  const msgArea = document.getElementById('msgArea');
  const btnSubmit = document.getElementById('btnSubmit');
  let slotSelecionado = null;

  function formatarDiaTitulo(dataStr) {
    const d = new Date(dataStr + 'T12:00:00');
    return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  }

  function formatarHora(dataHoraStr) {
    return dataHoraStr.slice(11, 16);
  }

  function agruparPorDia(slots) {
    const grupos = {};
    for (const s of slots) {
      const dia = s.start_datetime.slice(0, 10);
      if (!grupos[dia]) grupos[dia] = [];
      grupos[dia].push(s);
    }
    return grupos;
  }

  function renderSlots(slots) {
    if (!slots.length) {
      listaSlots.innerHTML = '<p class="vazio">Nenhum horário disponível nos próximos dias. Entre em contato pelo WhatsApp.</p>';
      return;
    }
    const grupos = agruparPorDia(slots);
    listaSlots.innerHTML = '';
    for (const dia of Object.keys(grupos).sort()) {
      const div = document.createElement('div');
      div.className = 'dia-grupo';
      const titulo = document.createElement('div');
      titulo.className = 'dia-titulo';
      titulo.textContent = formatarDiaTitulo(dia);
      div.appendChild(titulo);
      const slotsDiv = document.createElement('div');
      slotsDiv.className = 'slots';
      for (const slot of grupos[dia]) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'slot-btn';
        btn.textContent = formatarHora(slot.start_datetime);
        btn.onclick = () => selecionarSlot(slot, btn);
        slotsDiv.appendChild(btn);
      }
      div.appendChild(slotsDiv);
      listaSlots.appendChild(div);
    }
  }

  function selecionarSlot(slot, btnEl) {
    slotSelecionado = slot;
    document.querySelectorAll('.slot-btn').forEach((b) => b.classList.remove('selecionado'));
    btnEl.classList.add('selecionado');
    form.classList.add('ativo');
    msgArea.innerHTML = '';
    form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function carregarSlots() {
    try {
      const resp = await fetch(API_BASE + '/api/public/agenda/slots?dias=14');
      if (resp.status === 503) {
        listaSlots.innerHTML = '<p class="vazio">Agendamento online indisponível no momento. Entre em contato pelo WhatsApp.</p>';
        return;
      }
      const data = await resp.json();
      renderSlots(data.slots || []);
    } catch (e) {
      listaSlots.innerHTML = '<p class="vazio">Não foi possível carregar os horários. Tente novamente em instantes.</p>';
    }
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!slotSelecionado) return;
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Enviando…';
    msgArea.innerHTML = '';

    const fd = new FormData(form);
    const body = {
      website: fd.get('website'),
      name: fd.get('name'),
      phone: fd.get('phone'),
      email: fd.get('email'),
      message: fd.get('message'),
      start_datetime: slotSelecionado.start_datetime,
    };

    try {
      const resp = await fetch(API_BASE + '/api/public/agenda/agendar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (resp.ok) {
        form.classList.remove('ativo');
        listaSlots.innerHTML = '';
        msgArea.innerHTML = '<div class="msg sucesso">Consulta agendada! Em breve entraremos em contato para confirmar.</div>';
      } else if (resp.status === 409) {
        msgArea.innerHTML = '<div class="msg erro">Esse horário acabou de ser ocupado — escolha outro abaixo.</div>';
        slotSelecionado = null;
        form.classList.remove('ativo');
        carregarSlots();
      } else {
        msgArea.innerHTML = '<div class="msg erro">' + (data.error || 'Não foi possível agendar. Tente novamente.') + '</div>';
      }
    } catch (e) {
      msgArea.innerHTML = '<div class="msg erro">Falha de conexão. Tente novamente.</div>';
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Confirmar agendamento';
    }
  });

  carregarSlots();
})();
</script>
</body>
</html>
